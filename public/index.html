<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shresth@22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --panel-border: #232b34;
    --text: #dbe2e9;
    --dim: #6b7683;
    --accent: #e3a34e;
    --accent-dim: #8a6a3a;
    --ok: #78c29e;
    --warn: #d9776a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #eef1ea;
    --panel: #f8f9f5;
    --panel-border: #cfd6c9;
    --text: #1d2420;
    --dim: #6f7a6f;
    --accent: #a86a1f;
    --accent-dim: #c9974f;
    --ok: #2f7a56;
    --warn: #b1493d;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1ea;
      --panel: #f8f9f5;
      --panel-border: #cfd6c9;
      --text: #1d2420;
      --dim: #6f7a6f;
      --accent: #a86a1f;
      --accent-dim: #c9974f;
      --ok: #2f7a56;
      --warn: #b1493d;
    }
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100%;
  }
  .frame {
    width: 100%;
    max-width: 720px;
  }
  .titlebar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 4px 10px 4px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.01em;
  }
  .titlebar .path { color: var(--accent); }
  .term {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 22px 22px 16px 22px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.55);
    min-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .scroll {
    flex: 1;
    overflow-y: auto;
    max-height: 60vh;
    scrollbar-width: thin;
  }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 8px; }
  .line {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line.boot { color: var(--dim); }
  .line.cmd { color: var(--text); }
  .line.cmd .prompt { color: var(--accent); }
  .line.out { color: var(--text); }
  .dim { color: var(--dim); }
  .ok { color: var(--ok); }
  .accent { color: var(--accent); }
  .warn { color: var(--warn); }
  .row { display: flex; gap: 8px; }
  .row .prompt { color: var(--accent); flex-shrink: 0; }

  .inputline {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--panel-border);
    padding-top: 12px;
  }
  .inputline .prompt { color: var(--accent); font-size: 14px; flex-shrink: 0; }
  .inputline input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    flex: 1;
    caret-color: var(--accent);
  }
  .hint {
    color: var(--dim);
    font-size: 12px;
    padding: 10px 4px 0 4px;
  }
  .cake { color: var(--accent); font-size: 13px; line-height: 1.35; white-space: pre; }
</style>
</head>
<body>
<div class="frame">
  <div class="titlebar"><span>rishika ~ birthday-gift</span><span class="path">~/for/shresth</span></div>
  <div class="term">
    <div class="scroll" id="scroll"></div>
    <div class="inputline">
      <span class="prompt">shresth@22:~$</span>
      <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">
    </div>
    <div class="hint">type <span class="accent">help</span> to get started</div>
  </div>
</div>

<script>
const scrollEl = document.getElementById('scroll');
const input = document.getElementById('cmdInput');

function addLine(html, cls) {
  const div = document.createElement('div');
  div.className = 'line ' + (cls || 'out');
  div.innerHTML = html;
  scrollEl.appendChild(div);
  scrollEl.scrollTop = scrollEl.scrollHeight;
}

function addRaw(text, cls) {
  addLine(escapeHtml(text), cls);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const bootLines = [
  "connecting to shresth_desh_mauli@22 ...",
  "authenticating with 5 hours of unpaid overtime ...",
  "loading legendary_rotation_system.dll ...",
  "resolving dependency: frost_vs_tagore (patched, 2025) ...",
  "mounting /memories ...",
  "boot complete."
];

let i = 0;
function typeBoot() {
  if (i < bootLines.length) {
    addRaw(bootLines[i], 'boot');
    i++;
    setTimeout(typeBoot, 260);
  } else {
    addLine('&nbsp;');
    addLine('<span class="accent">Happy 22nd, Shresth.</span> This is a birthday card someone built instead of bought. Type <span class="accent">help</span> to look around.', 'out');
    addLine('&nbsp;');
    input.focus();
  }
}
typeBoot();

const commands = {
  help: () => [
  "available commands:",
  "  whoami        - who this terminal thinks you are",
  "  neofetch      - system info, repurposed",
  "  log           - commit history of us",
  "  status        - current build status",
  "  ls            - list files in this directory",
  "  cat <file>    - read a file",
  "  ping          - test backend server connection",
  "  audit         - view real-time PostgreSQL command logs",
  "  birthday      - the actual point of all this",
  "  clear         - clear the screen"
].join("\n"),

  whoami: () => [
    "shresth_desh_mauli",
    "role: expert coder, chronic pen-borrower, self-declared chocolate boy",
    "known bugs: bunks classes, replies to everything with 'nice', never gives a straight answer under 3 exchanges",
    "known features: listens properly once you get past the shrug, remembers birthdays, still owes a surprise from last July"
  ].join("\n"),

  neofetch: () => [
    "        /\\_/\\        OS: HITK CSE, Sec A",
    "       ( o.o )       Host: green plastic file holder",
    "        > ^ <        Kernel: legendary_rotation_system v22",
    "                     Uptime: since the Mechanical Workshop incident",
    "  -----------------  Shell: crisp texts (bash, not epic)",
    "  Theme: grey nerdcore [retired]",
    "  CPU: 1548 WBJEE cores",
    "  Memory: catalogued chaos, unlimited, never swapped",
    "  Status: friend-zoned the concept of a normal birthday gift"
  ].join("\n"),

  log: () => [
    'commit 9f2a1c  <span class="dim">Sem 1</span>',
    '  fix: corrected Frost/Tagore misattribution on second attempt',
    "",
    'commit 6b7e04  <span class="dim">Sem 1</span>',
    '  feat: coke bottle accepted as valid peace treaty currency',
    "",
    'commit d13af9  <span class="dim">Sem 2</span>',
    '  revert: girlfriend-application-pamphlet.md (rejected by reviewer)',
    "",
    'commit 4c88b1  <span class="dim">Sem 3</span>',
    '  chore: retired grey nerdcore frames, no regrets logged',
    "",
    'commit e701aa  <span class="dim">21st bday</span>',
    '  feat: shipped 4-page handwritten chronicle, on time, under exam pressure',
    "",
    'commit HEAD    <span class="dim">today</span>',
    '  feat: this. built instead of bought.'
  ].join("\n"),

  status: () => [
    "build: passing",
    "tests: annoying (all of them, on purpose)",
    "affection.deprecated: false",
    "note: some things get quieter. not everything logged gets deleted."
  ].join("\n"),

  ls: () => "wish.txt  chronicle_2025.md  coke_ledger.csv  birthday",

  clear: () => { scrollEl.innerHTML = ''; return null; },

  birthday: () => {
    const cake = [
      "        ()   ()   ()",
      "        ||   ||   ||",
      "     ___||___||___||___",
      "    |                   |",
      "    |     22, coded      |",
      "    |    with 5 hours    |",
      "    |___________________|"
    ].join("\n");
    return '<span class="cake">' + escapeHtml(cake) + '</span>\n\n<span class="ok">happy birthday.</span> no gamepads, no black frames, just this. built, not bought. — Rishika';
  }
};

function catFile(name) {
  const files = {
    'wish.txt': "some gifts are bought. this one compiled clean on the first try, which is more than I can say for most of our arguments. happy 22nd.",
    'chronicle_2025.md': "already delivered, last September, 4 pages, handwritten, under exam pressure. this one's shorter on purpose.",
    'coke_ledger.csv': "date,item,status\nlast_sem,coke,delivered_late_but_delivered\ntoday,nothing_owed,settled",
    'secret_2026.txt': "fetching from backend database..."
  };
  if (files[name]) return files[name];
  return "cat: " + name + ": no such file";
}

async function run(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;
  addLine('<span class="prompt">shresth@22:~$</span> ' + escapeHtml(trimmed), 'cmd');

  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();

  // 1. Clear terminal locally
  if (cmd === 'clear') {
    scrollEl.innerHTML = '';
    return;
  }

  // 2. Query Backend Serverless API
  try {
    const res = await fetch('/api/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd, rawInput: trimmed })
    });
    const data = await res.json();

    // If backend returns direct output (for ping, audit, or backend files), render it!
    if (data.output) {
      addLine(escapeHtml(data.output));
      return;
    }
  } catch (err) {
    // If offline or backend fails, gracefully fall back to local commands
  }

  // 3. Fallback to Local Command Engine
  if (cmd === 'cat') {
    if (parts.length < 2) { addRaw('usage: cat <file>'); return; }
    addRaw(catFile(parts.slice(1).join(' ')));
    return;
  }

  if (commands[cmd]) {
    const out = commands[cmd]();
    if (out !== null && out !== undefined) addLine(out);
    return;
  }

  addLine('command not found: ' + escapeHtml(cmd) + '. try <span class="accent">help</span>.');
}

const history = [];
let histIdx = -1;

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value;
    if (val.trim()) { history.push(val); histIdx = history.length; }
    run(val);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; setTimeout(() => input.setSelectionRange(input.value.length, input.value.length)); }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
    else { histIdx = history.length; input.value = ''; }
    e.preventDefault();
  }
});

document.querySelector('.term').addEventListener('click', () => input.focus());
</script>
</body>
</html>
